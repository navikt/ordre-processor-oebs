name: Dependabot auto-merge
on:
  schedule:
    - cron: '0 7-13 * * 1-5'
  workflow_dispatch:

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app-token
        with:
          app-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@69852d2204654904759e85f88f4a45bbf8854905
        with:
          token: ${{ steps.app-token.outputs.token }}
          blackout-periods: "Sat,Sun,May 1,May 17,Dec 24-Jan 3"
          semver-filter: 'major,patch,minor,unknown'
          auto-approve: true
          merge-method: 'squash'
