name: Deploy alerts for ordre-processor-oebs-t1

on:
  push:
    branches:
      - main
    paths:
      - .nais/alertconfig-dev.yaml
      - .nais/prometheusrule-dev.yaml
      - .github/workflows/deploy-alerts.yaml
  workflow_dispatch:

concurrency:
  group: deploy-alerts-ordre-processor-oebs-t1
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy alerts to dev-gcp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Deploy alerts to dev-gcp
        uses: nais/deploy/actions/deploy@5fdd91aaf69bb0d6dd5e5118cdacb639f487b93b
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/alertconfig-dev.yaml,.nais/prometheusrule-dev.yaml
